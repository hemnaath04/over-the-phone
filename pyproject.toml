[project]
name = "over-the-phone"
version = "0.1.0"
description = "Does AssemblyAI-TTS-1 survive a real phone call? Entity accuracy and latency over telephony audio."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]
# The LiveKit phone agent (agent/phone_agent.py). Not installed by default: about 200 MB.
agent = [
    "livekit-agents[openai,silero]~=1.8",
    "livekit-plugins-assemblyai>=1.8.9",
    "python-dotenv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

pythonpath = ["."]
