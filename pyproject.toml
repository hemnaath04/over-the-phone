[project]
name = "over-the-phone"
version = "0.1.0"
description = "Does AssemblyAI-TTS-1 survive a real phone call? Entity accuracy and latency over telephony audio."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

pythonpath = ["."]
